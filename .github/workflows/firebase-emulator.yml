name: Firebase Emulator Tests

on:
  push:
    branches:
      - firebase-integration/draft
  pull_request:
    branches:
      - firebase-integration/draft
  workflow_dispatch:

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app and test dependencies
        run: npm install

      - name: Install Cloud Functions dependencies
        run: npm install
        working-directory: functions

      - name: Run Firestore and Storage rules tests in emulators
        run: npx firebase-tools emulators:exec --project patnabiz-emulator-tests --only firestore,storage "npm test"
