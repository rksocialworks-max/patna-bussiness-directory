name: Firebase Emulator and Build Tests

on:
  push:
    branches:
      - firebase-integration/draft
  pull_request:
    branches:
      - firebase-integration/draft
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install application dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Check Cloud Functions syntax
        run: node --check functions/src/index.js

      - name: Install Cloud Functions dependencies
        run: npm install
        working-directory: functions

      - name: Run Firestore and Storage rules tests in emulators
        run: npx --yes firebase-tools@latest emulators:exec --project patnabiz-emulator-tests --only firestore,storage "npm test"
